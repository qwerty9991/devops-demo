name: Infrastructure and CI/CD Pipeline

on:
  push:
    branches:
      - webapp

jobs:
  provision-infrastructure:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Provision AWS EKS using Infra Action
        uses: ./.github/actions/infra-action
        with:
          aws-region: 'us-east-1'
          role-to-assume: ${{ secrets.github-demo }}

  deploy-application:
    name: Build and Deploy Application
    runs-on: ubuntu-latest
    needs: provision-infrastructure
    steps:
      - name: Deploy to AWS EKS using CI/CD Action
        uses: ./.github/actions/cicd-action
        with:
          aws-region: 'us-east-1'
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_TOKEN }}
