name: CI/CD Pipeline for Java Web App

on:
  push:
    branches:
      - webapp   # Trigger this workflow only on pushes to the "webapp" branch
#  pull_request:
#    branches:
#      - webapp   # Trigger on pull requests to the "webapp" branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout "webapp" branch
        uses: actions/checkout@v3
        with:
          ref: webapp   # Checkout the "webapp" branch

      - name: Set up Maven 3.9
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven 3.9
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build with Maven
        run: mvn clean package --file webapp/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image to DockerHub
        run: |
          docker build -t qwerty99/webapp:java-17-ci-cd -f Dockerfile .
          docker push qwerty99/webapp:java-17-ci-cd
